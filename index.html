<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Infinitum — TikTok Auth Callback</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 16px;
      background: #0f0f12;
      color: #f2f2f5;
    }
    code, textarea {
      font-family: ui-monospace, Consolas, monospace;
      word-break: break-all;
    }
    textarea {
      width: 100%;
      min-height: 96px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1a1a22;
      color: #fff;
    }
    .ok { color: #6dffb0; }
    .err { color: #ff7b7b; }
    button {
      margin-top: 12px;
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      background: #fe2c55;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Infinitum × TikTok</h1>
  <p id="status">กำลังอ่าน authorization code...</p>
  <label for="codeBox"><strong>Authorization code</strong> — คัดลอกไปวางในเทอร์มินัล</label>
  <textarea id="codeBox" readonly></textarea>
  <button type="button" id="copyBtn">คัดลอก code</button>
  <p style="opacity:.7;margin-top:24px;font-size:14px">
    หน้านี้ต้องอยู่ที่ Redirect URI ที่ลงทะเบียนใน TikTok Login Kit<br />
    เช่น <code>https://sakgomath-tiktok.github.io/infinitum/</code>
  </p>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const err = params.get("error");
    const desc = params.get("error_description") || "";
    const status = document.getElementById("status");
    const box = document.getElementById("codeBox");
    if (err) {
      status.className = "err";
      status.textContent = "Authorize ล้มเหลว: " + err + (desc ? " — " + desc : "");
    } else if (code) {
      status.className = "ok";
      status.textContent = "สำเร็จ — คัดลอก code ด้านล่าง แล้ววางในเทอร์มินัลที่รัน tiktok_auth.py";
      box.value = code;
    } else {
      status.textContent = "ยังไม่มี code ใน URL (เปิดหน้านี้หลังกด Allow จาก TikTok)";
    }
    document.getElementById("copyBtn").onclick = async () => {
      if (!box.value) return;
      await navigator.clipboard.writeText(box.value);
      status.textContent = "คัดลอกแล้ว — กลับไปวางในเทอร์มินัลได้";
      status.className = "ok";
    };
  </script>
</body>
</html>
